services:
  mahal-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mahal-backend
    ports:
      - "4000:4000"
    env_file: backend/.env
    depends_on:
      mahal-oracle-26ai:
        condition: service_healthy
    networks:
      - mahal
    restart: unless-stopped

  mahal-oracle-26ai:
    container_name: mahal-oracle-26ai
    image: container-registry.oracle.com/database/free:latest
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      ORACLE_PWD: ${ORACLE_PWD:-Oracle123}
    volumes:
      - oracle-data:/opt/oracle/oradata
    networks:
      - mahal
    healthcheck:
      test: ["CMD", "sqlplus", "-s", "/", "as", "sysdba", "-c", "SELECT 1 FROM dual"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

networks:
  mahal:
    driver: bridge

volumes:
  oracle-data:
